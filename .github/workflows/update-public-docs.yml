name: Update public release description

on:
  push:
    tags:
      - 'public-docs-*'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Update existing release notes only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          base = 'https://api.github.com/repos/' + os.environ['GH_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28',
                     'User-Agent': 'RemoteGPT-public-docs'}
          def request(path, data=None):
              req = urllib.request.Request(base + path, headers=headers,
                      data=None if data is None else json.dumps(data).encode(),
                      method='GET' if data is None else 'PATCH')
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          release = request('/releases/tags/v1.0.51')
          assert release['tag_name'] == 'v1.0.51' and not release['draft']
          before = [(a['id'], a['name'], a['size']) for a in release['assets']]
          body = pathlib.Path('docs/releases/1.0.51.md').read_text()
          assert 'chat-home.jpg' not in body and 'multi-session-notifications.jpg' not in body
          updated = request('/releases/' + str(release['id']), {'body': body})
          assert updated['body'] == body
          assert [(a['id'], a['name'], a['size']) for a in updated['assets']] == before
          print('Release notes updated; existing tag and all APK assets preserved.')
          PY
