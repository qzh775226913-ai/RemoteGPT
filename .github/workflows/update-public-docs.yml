name: Update public release descriptions

on:
  push:
    tags:
      - 'public-docs-*'

permissions:
  contents: read

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Update existing release notes only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          base = 'https://api.github.com/repos/' + os.environ['GH_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28',
                     'User-Agent': 'RemoteGPT-public-docs'}
          def request(path, data=None):
              req = urllib.request.Request(base + path, headers=headers,
                      data=None if data is None else json.dumps(data).encode(),
                      method='GET' if data is None else 'PATCH')
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          def assets(release):
              return sorted((a['id'], a['name'], a['size'], a.get('digest'))
                            for a in release['assets'])
          for version in ('1.0.51', '1.0.54'):
              tag = 'v' + version
              release = request('/releases/tags/' + tag)
              assert release['tag_name'] == tag and not release['draft']
              before = assets(release)
              ref = request('/git/ref/tags/' + tag)['object']
              body = pathlib.Path('docs/releases/' + version + '.md').read_text()
              updated = request('/releases/' + str(release['id']), {'body': body})
              assert updated['body'] == body
              assert assets(updated) == before
              assert request('/git/ref/tags/' + tag)['object'] == ref
              for field in ('id', 'tag_name', 'target_commitish', 'name', 'draft', 'prerelease'):
                  assert updated[field] == release[field]
              print('Updated description: ' + tag)
          PY
