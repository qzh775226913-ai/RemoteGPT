name: Withdraw 1.0.55 release
on:
  push:
    tags:
      - 'withdraw-release-1-0-55-*'
permissions:
  contents: read
jobs:
  withdraw:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Return the requested release to draft without deleting assets or tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PYTHON'
          import json, os, urllib.request
          base = 'https://api.github.com/repos/' + os.environ['GH_REPOSITORY']
          def request(path, data=None):
              req = urllib.request.Request(base + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28'},
                  data=None if data is None else json.dumps(data).encode(),
                  method='GET' if data is None else 'PATCH')
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          tag = request('/git/ref/tags/v1.0.55')['object']
          assert tag['sha'] == '6cecd2e3064c223e12401e40dd0ce6c2ebcd1039'
          release = request('/releases/tags/v1.0.55')
          assert release['tag_name'] == 'v1.0.55'
          def assets(r):
              return sorted((a['id'], a['name'], a['size'], a.get('digest')) for a in r['assets'])
          updated = request('/releases/' + str(release['id']), {'draft': True})
          assert updated['draft'] and updated['id'] == release['id']
          assert assets(updated) == assets(release)
          assert request('/git/ref/tags/v1.0.55')['object'] == tag
          print('Withdrawn public release v1.0.55; release ID:', updated['id'])
          print('Assets and version tag preserved. Draft:', updated['draft'])
          PYTHON
