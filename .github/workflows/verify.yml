name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - uses: android-actions/setup-android@v3
      - name: Install required SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Install synthetic SSH fixture dependencies
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Full verification without production credentials
        run: python tools/verify.py
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          if-no-files-found: warn
          path: |
            app/build/verification/
            app/build/reports/
            app/build/test-results/
            app/build/screenshots/
